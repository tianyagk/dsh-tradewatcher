# dsh-tradewatcher bundle patch：把单行拆成「core + 功能行」的多行子组件。
#
# 机制（docs/DESIGN-SUBPLUGINS.md §1）：同一 package 可出现在多条 Loader 行，
# 靠 `id` + `config.row` 区分；每行的 host 半区是独立 fiber。
# 关闭某行由 profile 层写 `- id: tradewatcher-calendar` + `disabled: true`。
#
# 现状：**六行全部启用**（P3）。
# watchlist / portfolio 的路由前缀在 P1 就已进了 `ROW_ROUTES` ⇒ 这两行启用后自己提供那段路由；
# 如果把它们留成 disabled，客户端 gate 会把「自选」「持仓」两个 tab 一起隐藏（用户会以为功能没了），
# 而它们的路由又已被 core 排除 —— 那才是真的坏。P4 要做的只是复核与补测试，不再是"打开"。
#
# ⚠ 语义（task-53 明确）：**无 config ⇒ 只有 core 自己的部分**（功能行必须由 profile 显式装载）。
# 也就是说 core 的"排除列表"是**静态**的（不因行是否激活而变）：某行没被装载，它那段路由就 404。
# 向后兼容靠"本文件把六行都写好"来保证 —— 装 bundle 的 profile 拿到的是完整功能。
#
# 安装由 Lead 执行（本文件只写文件，不改 profile、不装 bundle）：
#   dsh plugin --profile web add file:./dsh-tradewatcher
- insert:
    - id: tradewatcher-core
      name: 'dsh-tradewatcher'
      config: { row: core }
    - id: tradewatcher-calendar
      name: 'dsh-tradewatcher'
      config: { row: calendar }
    # cloudmap：云图是**纯客户端 iframe**（52etf），它自己没有 host 路由/工具 ⇒
    # 这一行的作用就是"文件里的 tab 开关"，P2 起启用。
    - id: tradewatcher-cloudmap
      name: 'dsh-tradewatcher'
      config: { row: cloudmap }
    # market（P3）：独占 /tradewatcher/breadth、/board、/industries、/rescue、/anomaly。
    # ⚠ /tradewatcher/industry（单 secid 行业查询）**留在 core**：详情抽屉在用它。
    - id: tradewatcher-market
      name: 'dsh-tradewatcher'
      config: { row: market }
    - id: tradewatcher-watchlist
      name: 'dsh-tradewatcher'
      config: { row: watchlist }
    - id: tradewatcher-portfolio
      name: 'dsh-tradewatcher'
      config: { row: portfolio }
