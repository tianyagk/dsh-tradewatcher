# dsh-tradewatcher bundle patch。
#
# ⚠ **当前只装一行（`id: tradewatcher`，不带 config）** —— 这是刻意的回退：
# 六行形态（core + 五个功能行）在本机启动时**未能装载**（所有 /tradewatcher/* 路由 404、
# 面板显示"插件服务异常"）。DSH 侧有一条硬规则：`dsh-client-modules` 把"同一 package
# 出现多个活跃 Loader 源"视为 composition error，而本包**同时带客户端半区**
# （`dsh.client` + `exports['./client']`）⇒ 同包多行会被整体拒绝。
# 要真正做成可独立开关的子组件，需要走"每个子组件各自一个包"的路子（参考 @linxin666/dsh-web-all），
# 细节见 docs/DESIGN-SUBPLUGINS.md §6。
#
# 行语义（代码侧仍然支持，供单独调试用）：
#   - 不带 config        ⇒ `all`：全量注册（**与拆分前逐字一致**，老 profile 靠这条）
#   - `config: { row: core }`      ⇒ 只注册内核那一段（排除功能行独占前缀与工具）
#   - `config: { row: <功能行> }`  ⇒ 只注册该行那一段
- insert:
    - id: tradewatcher
      name: 'dsh-tradewatcher'
