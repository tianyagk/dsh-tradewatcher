<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工具 · 全球期货交易时钟（设计稿）</title>
<!--
  工具 · 全球期货交易时钟（设计稿；自包含、无外链、无 CDN）
  · 头部：工具名 + 描述 + 右侧大号时钟（1 秒跳动）+ 北京 UTC+8 · MM.DD 星期X
  · 控件行：分组（黄金 / 原油 / 主要股指）、时区（北京 / 本地）、立即校时、刷新时间戳 + 行情源状态
  · 左：24 小时环形表盘（**整盘随时间逆时针旋转**，当前分钟对齐 12 点固定金线；刻度 01–24、
        时段弧与弧内标签随盘同转；中心显示当前时间与校时偏差；「▶ 预览」10 秒走完 24 小时）
  · 右：今日交易时段（色条 / 交易所·品种 / 代码 / 距下段开始 / 时段区间 / 状态）
  · 底：主要指数 6 张卡 + 期货自选·主连 5 张卡（有数据 = 数值，无数据 = — + 原因，不用 0/旧值占位）
  · 主题：沿用现有 token（浅色为主，深色同一套 token）；弧段用主题色阶；块间 16 / 组内 8；卡片 1px + 圆角 10
-->
<style>

  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  :root{
    color-scheme:light;
    --bg:#f5f6f8; --card:#ffffff; --card2:#f2f4f7; --line:#e2e5ea; --line2:#eceef2; --lineStrong:#cfd3dc;
    --text:#16181d; --dim:#4c535f; --muted:#6f7787;
    --accent:#5e6ad2; --accent-soft:rgba(94,106,210,.14); --on-accent-soft:#3a44a8;
    --up:#e5484d; --down:#0e8f5c;
    --gold:#c9a227;
    --arc-1:#4C6EF5; --arc-2:#E8590C; --arc-3:#7048E8; --arc-4:#0C8599; --arc-5:#C2255C; --arc-6:#2F9E44;
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme:dark;
      --bg:#010102; --card:#0f1011; --card2:#16181b; --line:#23252a; --line2:#1b1d21; --lineStrong:#34343a;
      --text:#f7f8f8; --dim:#c8ced8; --muted:#8a8f98;
      --accent:#5e6ad2; --accent-soft:rgba(94,106,210,.22); --on-accent-soft:#dde0ff;
      --up:#ff5f6d; --down:#27a644;
      --gold:#e0b84a;
      --arc-1:#91A7FF; --arc-2:#FFA94D; --arc-3:#B197FC; --arc-4:#66D9E8; --arc-5:#F783AC; --arc-6:#8CE99A;
    }
  }
  body{background:var(--bg);color:var(--text);
    font:12px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    letter-spacing:-0.006em;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1440px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
  .muted{color:var(--muted)}
  .mono,.num{font-variant-numeric:tabular-nums}
  .up{color:var(--up)} .down{color:var(--down)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(16,24,40,.05)}
  .hd{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border-bottom:1px solid var(--line)}
  .hd .t{font-size:14px;font-weight:600}
  .hd .m{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
  .bd{padding:12px}

  /* ── 头部 ── */
  .pagehd{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
  .pagehd h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-0.02em}
  .pagehd .desc{margin:2px 0 0;color:var(--muted);font-size:12px}
  .clockbox{margin-left:auto;text-align:right}
  .clock{font-size:34px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
  .clockmeta{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

  /* ── 控件行 ── */
  .controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 12px;background:var(--card);
    border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(16,24,40,.05)}
  .ctl{display:inline-flex;align-items:center;gap:6px}
  .ctl>span{color:var(--muted);font-size:12px}
  select{height:26px;padding:0 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);
    font:inherit;font-size:12px;cursor:pointer}
  .btn{display:inline-flex;align-items:center;justify-content:center;height:26px;padding:0 10px;border:1px solid var(--line);
    border-radius:8px;background:transparent;color:var(--text);font:inherit;font-size:12px;cursor:pointer}
  .btn.tonal{background:var(--accent-soft);border-color:transparent;color:var(--on-accent-soft);font-weight:600}
  .stamp{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11.5px}
  .src{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 6px;border-radius:6px;border:1px solid var(--line);background:var(--card2);font-size:11.5px}
  .src.ok::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--down)}
  .src.bad::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--up)}

  /* ── 上排：表盘 + 时段列表 ── */
  .grid{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:16px;align-items:start}
  @media (max-width:1100px){ .grid{grid-template-columns:minmax(0,1fr)} }
  .dialwrap{padding:8px}
  /* 表盘盒子：1:1 且宽度=SVG 宽度；svg 与覆盖层都铺满同一个盒子 ⇒ 两者盒子完全重合，与 padding/标题无关 */
  .dialbox{position:relative;width:100%;max-width:440px;margin:0 auto;aspect-ratio:1 / 1}
  .dialbox>svg{position:absolute;inset:0;display:block;width:100%;height:100%}
  /* 圆心文字：覆盖层铺满 + grid 居中；三行固定 18px 行高，整体相对圆心对称 */
  .dialcenter{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
  .ctext{display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ctext>div{height:18px;line-height:18px;white-space:nowrap}
  .ctext .now{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  .ctext .off{color:var(--muted);font-size:11.5px}
  .ctext .grp{color:var(--dim);font-size:12px}
  .dial-ring{fill:none;stroke:var(--line);stroke-width:1}
  .dial-tick{stroke:var(--lineStrong);stroke-width:1}
  .dial-tick.major{stroke:var(--dim);stroke-width:1.4}
  .dial-lab{fill:var(--muted);font-size:10px;text-anchor:middle}
  .dial-arc{fill:none;stroke-width:12;stroke-linecap:round}
  .dial-arc-lab{font-size:11px;font-weight:600;fill:var(--text);paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
  .dial-ptr{stroke:var(--gold);stroke-width:2.5;stroke-linecap:round}
  .dial-hub{fill:var(--gold)}
  .dial-disc{fill:var(--card);stroke:var(--gold);stroke-opacity:.30;stroke-width:1}

  /* ── 时段表 ── */
  .quotestrip{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line2)}
  .qchip{display:inline-flex;align-items:center;gap:6px;padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card2);font-size:11.5px}
  .qchip.bad{border-style:dashed;color:var(--muted)}
  .qchip .v{font-variant-numeric:tabular-nums;font-weight:600}
  .qline{color:var(--muted);font-size:11.5px;line-height:20px}
  .tbl{width:100%;border-collapse:collapse;font-size:12px}
  .tbl th{height:24px;padding:0 8px;font-weight:500;color:var(--muted);text-align:left;white-space:nowrap;background:var(--card2);border-bottom:1px solid var(--line)}
  .tbl td{height:26px;padding:0 8px;white-space:nowrap;border-bottom:1px solid var(--line2)}
  .tbl th:first-child,.tbl td:first-child{padding-left:12px}
  .tbl th:last-child,.tbl td:last-child{padding-right:12px}
  .tbl tbody tr:last-child td{border-bottom:0}
  .tbl tbody tr:hover td{background:var(--card2)}
  .bar{width:10px;padding:0 0 0 12px !important}
  .bar i{display:block;width:6px;height:14px;border-radius:2px}
  .pill{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;font-size:11.5px;font-weight:600}
  .pill.on{color:var(--on-accent-soft);background:var(--accent-soft)}
  .pill.off{color:var(--muted);background:var(--card2);font-weight:500}
  .cd{font-variant-numeric:tabular-nums}

  /* ── 底部卡片 ── */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;padding:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;display:flex;flex-direction:column;gap:4px}
  .stat.empty{border-style:dashed}
  .stat-top{display:flex;align-items:baseline;gap:6px}
  .stat-top .name{font-weight:600;font-size:12.5px}
  .stat-top .code{margin-left:auto;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
  .stat-mid{display:flex;align-items:baseline;gap:8px}
  .stat-mid .value{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.01em}
  .stat-mid .chg{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
  .stat-meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums}
  .stat-meta .pill{margin-left:auto}
  .stat-reason{color:var(--muted);font-size:11.5px}
</style>
</head>

<div class="wrap">

<header class="pagehd">
  <div>

      </div>
    </div>
  </section>

  <section class="card" aria-label="今日交易时段">
    <div class="hd"><span class="t">今日交易时段</span><span class="m" id="listmeta">5 段 · 北京 UTC+8</span></div>
    <div class="quotestrip" id="quotes"></div>
    <table class="tbl">
      <thead><tr><th>色条</th><th>交易所 · 品种</th><th>代码</th><th class="num">距下段开始</th><th>时段区间</th><th>状态</th></tr></thead>
      <tbody id="rows"></tbody>

  </section>
</div>

<section class="card" aria-label="主要指数">

</div>

      var m = (k * 60) % 1440;
      var a = polar(R_OUT, m), b = polar(R_OUT - (k % 3 === 0 ? 12 : 7), m);
      g.push('<line class="dial-tick' + (k % 3 === 0 ? ' major' : '') + '" x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) +
        '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) + '"/>');
      var lp = polar(R_OUT - 24, m);
      /* 刻度数字反向自转，保证随盘走位但仍正向可读 */
      g.push('<text class="dial-lab" x="' + lp[0].toFixed(1) + '" y="' + (lp[1] + 3.5).toFixed(1) +
        '" transform="rotate(' + (-rot).toFixed(3) + ' ' + lp[0].toFixed(1) + ' ' + lp[1].toFixed(1) + ')">' + pad(k) + '</text>');
    }
    var list = DATA.sessions[group];
    list.forEach(function (s, i) {
      var r = 160 - s.lane * 20;
      var start = (s.start + shift + 1440) % 1440;
      var end = (s.end + shift + 1440) % 1440;
      arcSegments(r, start, end).forEach(function (p) {
        g.push('<path class="dial-arc" d="' + p + '" stroke="var(--arc-' + ((i % 6) + 1) + ')"/>');
      });
      /* 弧内标签：取时段中点，沿切线（含整盘旋转后的有效角度） */
      var span = (end - start + 1440) % 1440 || 1440;
      /* 相邻道错开贴标位置（偶数道 62%、奇数道 38%），避免几乎同角度的两段标签压在一起 */
      var mid = (start + span * (s.lane % 2 === 0 ? 0.62 : 0.38)) % 1440;
      var tp = polar(r, mid);
      /* 文字随盘走位、但保持水平可读（与刻度数字同一条规则：反向自转抵消整盘旋转） */
      var rotText = -rot;
      g.push('<text class="dial-arc-lab" x="' + tp[0].toFixed(1) + '" y="' + (tp[1] + 3).toFixed(1) +
        '" text-anchor="middle" transform="rotate(' + rotText.toFixed(1) + ' ' + tp[0].toFixed(1) + ' ' + tp[1].toFixed(1) + ')">' +
        s.short + '</text>');
    });
    var svg = [];
    svg.push('<circle class="dial-ring" cx="' + CX + '" cy="' + CY + '" r="' + R_OUT + '"/>');
    svg.push('<g class="dial-rot" transform="rotate(' + rot.toFixed(3) + ' ' + CX + ' ' + CY + ')">' + g.join('') + '</g>');
    /* 固定的金色读标：12 点方向，从圆心到外圈，**不随时间转动** */
    svg.push('<line class="dial-ptr" id="needle" x1="' + CX + '" y1="' + CY + '" x2="' + CX + '" y2="' + (CY - R_OUT + 2) + '"/>');
    svg.push('<circle class="dial-hub" cx="' + CX + '" cy="' + (CY - R_OUT + 2) + '" r="3.2"/>');
    /* 中心盘压住金线根部，中心文字再压在盘上 */
    svg.push('<circle class="dial-disc" cx="' + CX + '" cy="' + CY + '" r="64"/>');
    document.getElementById('dial').innerHTML = svg.join('');
  }

  /* ── 列表 ── */
  function inSession(mod, s, shift) {
    var start = (s.start + shift + 1440) % 1440;
    var end = (s.end + shift + 1440) % 1440;
    if (start < end) return mod >= start && mod < end;
    return mod >= start || mod < end;
  }
  function nextStartSec(now, s, shift) {
    var d = zoned(now);
    var mod = minOfDay(d) * 60 + d.getUTCSeconds();
    var start = ((s.start + shift + 1440) % 1440) * 60;
    var diff = start - mod;
    if (diff <= 0) diff += 86400;
    return diff;
  }
  function renderList(now, shift) {
    var rows = [];
    DATA.sessions[group].forEach(function (s, i) {
      var trading = inSession(minOfDay(zoned(now)), s, shift);
      var start = (s.start + shift + 1440) % 1440;
      var end = (s.end + shift + 1440) % 1440;
      var range = pad(Math.floor(start / 60)) + ':' + pad(start % 60) + '–' + pad(Math.floor(end / 60)) + ':' + pad(end % 60);
      var wrap = end < start ? ' <span class="muted">次日</span>' : '';
      rows.push('<tr>' +
        '<td class="bar"><i style="background:var(--arc-' + ((i % 6) + 1) + ')"></i></td>' +
        '<td><b>' + s.ex + '</b> · ' + s.name + '</td>' +
        '<td class="mono muted">' + s.code + '</td>' +
        '<td class="num cd">' + mmss(nextStartSec(now, s, shift)) + '</td>' +
        '<td class="mono">' + range + wrap + '</td>' +
        '<td><span class="pill ' + (trading ? 'on">交易中' : 'off">时段外') + '</span></td>' +
        '</tr>');
    });
    document.getElementById('rows').innerHTML = rows.join('');
  }

  function renderQuotes() {
    var list = DATA.quotes[group];
    var bad = list.filter(function (q) { return q.state === 'bad'; });
    var good = list.filter(function (q) { return q.state !== 'bad'; });
    var out = good.map(function (q) {
      return '<span class="qchip">' + q.sym + '<span class="mono muted">' + q.code + '</span>' +
        '<span class="v up">' + q.value + ' ' + q.chg + '</span>' +
        '<span class="muted">' + q.src + ' · ' + q.time + '</span></span>';
    });
    if (bad.length > 0) {
      out.push('<span class="qline">' + bad.length + ' 个期货代码缺数据：' +
        bad.map(function (q) { return q.code; }).join(' / ') + '（东财熔断）</span>');
    }
    document.getElementById('quotes').innerHTML = out.join('');
  }

  function renderCards() {
    document.getElementById('indices').innerHTML = DATA.indices.map(function (x) {
      var cls = x.chg.indexOf('-') === 0 ? 'down' : 'up';
      return '<div class="stat">' +
        '<div class="stat-top"><span class="name">' + x.name + '</span><span class="code">' + x.code + '</span></div>' +
        '<div class="stat-mid"><span class="value">' + x.value + '</span><span class="chg ' + cls + '">' + x.chg + '</span></div>' +
        '<div class="stat-meta"><span>' + x.src + '</span><span>' + x.time + '</span><span class="pill on">' + x.status + '</span></div>' +
        '</div>';
    }).join('');
    document.getElementById('futures').innerHTML = DATA.futures.map(function (f) {
      if (f.empty === true) {
        return '<div class="stat empty">' +
          '<div class="stat-top"><span class="name">' + f.name + '</span><span class="code">' + f.code + '</span></div>' +
          '<div class="stat-mid"><span class="value muted">—</span><span class="chg muted">—</span></div>' +
          '<div class="stat-meta"><span>东财</span><span>—</span><span class="pill off">无数据</span></div>' +
          '<div class="stat-reason">' + f.reason + '</div>' +
          '</div>';
      }
      return '<div class="stat">' +
        '<div class="stat-top"><span class="name">' + f.name + '</span><span class="code">' + f.code + '</span></div>' +
        '<div class="stat-mid"><span class="value">' + f.value + '</span><span class="chg muted">—</span></div>' +
        '<div class="stat-meta"><span>东财</span><span>' + f.time + '</span><span class="pill on">正常</span></div>' +
        '</div>';
    }).join('');
  }

  function tick() {
    var now = nowMs();
    if (preview && (now - preview.baseMs) >= 86400000) { preview = null; pvLabel(); }
    var shift = zoneOffsetMin() - 480;
    var d = zoned(now);
    document.getElementById('clock').textContent = hms(d);
    document.getElementById('clockmeta').textContent = zoneName() + ' · ' + pad(d.getUTCMonth() + 1) + '.' + pad(d.getUTCDate()) + ' ' + WD[d.getUTCDay()];
    document.getElementById('dialnow').textContent = hms(d);
    document.getElementById('dialgrp').textContent = GROUP_LABEL[group];
    document.getElementById('dialmeta').textContent = GROUP_LABEL[group] + ' · ' + zoneName();
    document.getElementById('listmeta').textContent = DATA.sessions[group].length + ' 段 · ' + zoneName();
    renderDial(now, shift);
    renderList(now, shift);
  }

  document.getElementById('group').addEventListener('change', function (e) {
    group = e.target.value; renderQuotes(); tick();
  });
  document.getElementById('tz').addEventListener('change', function (e) {
    zone = e.target.value; tick();
  });
  var pvBtn = document.getElementById('preview');
  function pvLabel() {
    pvBtn.textContent = !preview ? '▶ 预览' : (preview.running ? '⏸ 暂停' : '▶ 继续');
  }
  function pvLoop() {
    if (!preview || !preview.running) return;
    tick();
    requestAnimationFrame(pvLoop);
  }
  pvBtn.addEventListener('click', function () {
    if (!preview) {
      preview = { baseMs: nowMs(), accMs: 0, running: true, startReal: Date.now() };
      pvLabel(); requestAnimationFrame(pvLoop);
    } else if (preview.running) {
      preview.accMs += (Date.now() - preview.startReal) * SPEED;
      preview.running = false;
      pvLabel(); tick();
    } else {
      preview.startReal = Date.now();
      preview.running = true;
      pvLabel(); requestAnimationFrame(pvLoop);
    }
  });
  /* 仅设计稿：把表盘定到某个时刻，便于截图核对（正式实现不带） */
  window.__clockAt = function (iso) {
    BASE = new Date(iso).getTime(); T0 = Date.now();
    preview = null; pvLabel(); tick();
  };

  document.getElementById('sync').addEventListener('click', function () {
    /* 立即校时：把页面时间对齐到本机时钟，并重算偏差（±0.4s 内） */
    var real = Date.now();
    BASE = real; T0 = Date.now();
    OFFSET = Math.round((Math.random() * 800 - 400));
    document.getElementById('dialoff').textContent = '校时偏差 ' + (OFFSET >= 0 ? '+' : '') + (OFFSET / 1000).toFixed(2) + 's';
    var d = new Date(real);
    document.getElementById('stamp').textContent = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' +
      pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    tick();
  });

  renderQuotes(); renderCards(); pvLabel(); tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
